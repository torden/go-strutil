name: Go Version Compatibility Test Matrix

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        # Test across multiple Go versions for maximum compatibility
        go-version:
          # Legacy versions (if available in CI)
          - '1.6'   # Minimum supported
          - '1.7'   # Context support
          - '1.8'   # Performance improvements
          - '1.9'   # Type aliases
          - '1.10'  # String builder improvements
          - '1.11'  # Go modules introduction
          - '1.12'  # Module improvements
          - '1.13'  # Error wrapping
          - '1.14'  # Current minimum
          - '1.15'  # Performance improvements
          - '1.16'  # Embed support
          - '1.17'  # Performance improvements
          - '1.18'  # Generics
          - '1.19'  # Performance improvements
          - '1.20'  # Performance improvements
          - '1.21'  # Performance improvements
          - '1.22'  # Performance improvements
          - '1.23'  # Latest stable
          - '1.24'  # Current latest
        os: [ubuntu-latest, windows-latest, macos-latest]

        # Exclude combinations that don't make sense or are unavailable
        exclude:
          # Very old Go versions might not be available on all OS
          - go-version: '1.6'
            os: windows-latest
          - go-version: '1.7'
            os: windows-latest
          - go-version: '1.8'
            os: windows-latest
          - go-version: '1.9'
            os: windows-latest
          - go-version: '1.10'
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Print Go version and environment
      run: |
        go version
        go env
      
    - name: Setup Windows tools (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        # Ensure proper line endings for Windows
        git config --global core.autocrlf true

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      shell: bash
      run: |
        # Handle different module systems
        if go help mod >/dev/null 2>&1; then
          echo "Using Go modules"
          go mod download
          go mod verify
        else
          echo "Using legacy GOPATH mode"
          go get -d -v ./...
        fi

    - name: Build
      shell: bash
      run: |
        # Build with version-specific tags
        if [[ "${{ matrix.go-version }}" =~ ^1\.(6|7|8|9|10)$ ]]; then
          echo "Building for legacy Go version"
          go build -tags "legacy" -v ./...
        elif [[ "${{ matrix.go-version }}" =~ ^1\.(1[1-7])$ ]]; then
          echo "Building for modern Go version without generics"
          go build -v ./...
        else
          echo "Building for modern Go version with generics"
          go build -tags "generics" -v ./...
        fi

    - name: Test
      shell: bash
      run: |
        # Run tests with appropriate build tags
        if [[ "${{ matrix.go-version }}" =~ ^1\.(6|7|8|9|10)$ ]]; then
          echo "Testing legacy Go version"
          go test -tags "legacy" -v ./...
        elif [[ "${{ matrix.go-version }}" =~ ^1\.(1[1-7])$ ]]; then
          echo "Testing modern Go version without generics"
          go test -v ./...
        else
          echo "Testing modern Go version with generics"
          go test -tags "generics" -v ./...
        fi

    - name: Test with race detector (Go 1.1+)
      if: ${{ ! contains(fromJson('["1.6", "1.7", "1.8", "1.9", "1.10"]'), matrix.go-version) }}
      run: |
        go test -race -v ./...

    - name: Benchmark (Go 1.1+)
      if: ${{ ! contains(fromJson('["1.6", "1.7", "1.8", "1.9", "1.10"]'), matrix.go-version) }}
      run: |
        go test -bench=. -benchmem ./...

    - name: Vet (Go 1.1+)
      if: ${{ ! contains(fromJson('["1.6", "1.7", "1.8", "1.9", "1.10"]'), matrix.go-version) }}
      run: |
        go vet ./...

  compatibility-report:
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Generate compatibility report
      run: |
        echo "## Go Version Compatibility Report" >> $GITHUB_STEP_SUMMARY
        echo "| Go Version | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 1.6 - 1.10 | Legacy Support ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| 1.11 - 1.17 | Modern Support ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| 1.18+ | Full Feature Support with Generics ✅ |" >> $GITHUB_STEP_SUMMARY