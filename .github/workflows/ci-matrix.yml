name: Go Version Compatibility Test Matrix (Disabled)

on:
  workflow_dispatch: # Manual trigger only
  # push:
  #   branches: [ master, main, develop ]
  # pull_request:
  #   branches: [ master, main, develop ]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        # Test across multiple Go versions for maximum compatibility
        go-version:
          # Supported versions (GitHub Actions compatible)
          - '1.13'  # Error wrapping
          - '1.14'  # Current minimum
          - '1.15'  # Performance improvements
          - '1.16'  # Embed support
          - '1.17'  # Performance improvements
          - '1.18'  # Generics
          - '1.19'  # Performance improvements
          - '1.20'  # Performance improvements
          - '1.21'  # Performance improvements
          - '1.22'  # Performance improvements
          - '1.23'  # Latest stable
        os: [ubuntu-latest, windows-latest, macos-latest]

        # Exclude combinations that don't make sense or are unavailable
        exclude:
          # Reduce matrix for faster CI
          - go-version: '1.13'
            os: windows-latest
          - go-version: '1.14'
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Print Go version and environment
      run: |
        go version
        go env
      
    - name: Setup Windows tools (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        # Ensure proper line endings for Windows
        git config --global core.autocrlf true

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      shell: bash
      run: |
        # Handle different module systems
        if go help mod >/dev/null 2>&1; then
          echo "Using Go modules"
          go mod download
          go mod verify
        else
          echo "Using legacy GOPATH mode"
          go get -d -v ./...
        fi

    - name: Build
      shell: bash
      run: |
        # Build with version-specific tags
        GO_MINOR=$(echo "${{ matrix.go-version }}" | cut -d. -f2)
        if [[ $GO_MINOR -ge 18 ]]; then
          echo "Building for Go 1.18+ with generics"
          go build -v ./...
        else
          echo "Building for Go 1.13-1.17"
          go build -v ./...
        fi

    - name: Test
      shell: bash
      run: |
        # Run tests with appropriate build tags
        GO_MINOR=$(echo "${{ matrix.go-version }}" | cut -d. -f2)
        if [[ $GO_MINOR -ge 18 ]]; then
          echo "Testing Go 1.18+ with generics"
          go test -v ./...
        else
          echo "Testing Go 1.13-1.17"
          go test -v ./...
        fi

    - name: Test with race detector
      if: matrix.os == 'ubuntu-latest'
      run: |
        go test -race -v ./...

    - name: Benchmark
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
      run: |
        go test -bench=. -benchmem ./...

    - name: Vet
      run: |
        go vet ./...

  compatibility-report:
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Generate compatibility report
      run: |
        echo "## Go Version Compatibility Report" >> $GITHUB_STEP_SUMMARY
        echo "| Go Version | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 1.6 - 1.10 | Legacy Support ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| 1.11 - 1.17 | Modern Support ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| 1.18+ | Full Feature Support with Generics ✅ |" >> $GITHUB_STEP_SUMMARY