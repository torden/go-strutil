# golangci-lint configuration for go-strutil
# Supports multiple Go versions with appropriate linter settings

run:
  # Timeout for analysis
  timeout: 5m

  # Exit code when at least one issue was found
  issues-exit-code: 1

  # Include test files in analysis
  tests: true

  # Allow multiple Go versions
  go: "1.18"

  # Directories to skip
  skip-dirs:
    - vendor
    - build
    - reports

  # Files to skip
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"

output:
  # Colored output
  color: always

  # Output format: colored-line-number|line-number|json|tab|checkstyle|code-climate
  format: colored-line-number

  # Print lines of code with issue
  print-issued-lines: true

  # Print linter name in the end of issue text
  print-linter-name: true

  # Make issues output unique by line
  uniq-by-line: true

  # Sort results by: filepath, line and column
  sort-results: true

linters-settings:
  # Disable default excludes to see all issues
  exclude-use-default: false

  # Configuration for specific linters
  errcheck:
    # Report about not checking of errors in type assertions
    check-type-assertions: true

    # Report about assignment of errors to blank identifier
    check-blank: true

  govet:
    # Report about shadowed variables
    check-shadowing: true

    # Settings per analyzer
    settings:
      printf:
        funcs:
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf

  golint:
    # Minimal confidence for issues
    min-confidence: 0.8

  gofmt:
    # Simplify code: gofmt with `-s` option
    simplify: true

  goimports:
    # Put imports beginning with prefix after 3rd-party packages
    local-prefixes: github.com/torden/go-strutil

  gocyclo:
    # Minimal code complexity to report
    min-complexity: 15

  maligned:
    # Print struct with more effective memory layout
    suggest-new: true

  dupl:
    # Tokens count to trigger issue
    threshold: 100

  goconst:
    # Minimal length of string constant
    min-len: 3

    # Minimum occurrences of constant string count to trigger issue
    min-occurrences: 3

  misspell:
    # Correct spellings using locale preferences for US or UK
    locale: US

  lll:
    # Max line length, lines longer will be reported
    line-length: 120

  unused:
    # Select the Go version to target
    go: "1.18"

  unparam:
    # Inspect exported functions
    check-exported: false

  nakedret:
    # Make an issue if func has more lines of code than this setting
    max-func-lines: 30

  prealloc:
    # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    # Which checks should be enabled
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc

  funlen:
    lines: 60
    statements: 40

linters:
  # Enable specific linters
  enable:
    - bodyclose
    - deadcode
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exportloopref
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - golint
    - gomnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - interfacer
    - lll
    - maligned
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - scopelint
    - staticcheck
    - structcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - varcheck
    - whitespace

  # Disable some linters that might not work well with all Go versions
  disable:
    - asciicheck
    - gochecknoglobals
    - gocognit
    - godot
    - godox
    - goerr113
    - gofumpt
    - goheader
    - gomodguard
    - gopkg
    - govet
    - nestif
    - nolintlint
    - prealloc
    - testpackage
    - wsl

issues:
  # List of regexps of issue texts to exclude
  exclude:
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"

    # golint: False positives for Go version compatibility
    - "should have a package comment, unless it's in another file for this package"

    # govet: Common false positives
    - "composite literal uses unkeyed fields"

    # staticcheck: Ignore version-specific code
    - "SA1019: .* is deprecated"

  # Exclude rules by text
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - goconst
        - gocognit
        - scopelint
        - lll

    # Exclude version compatibility files from some linters
    - path: compat_.*\.go
      linters:
        - unused
        - deadcode

    # Exclude legacy support files
    - path: .*legacy.*\.go
      linters:
        - staticcheck
        - unused

    # Exclude build tag specific files from unused linter
    - path: stringproc_enhanced\.go
      linters:
        - unused

    # Exclude some issues from version detection code
    - path: version_compat.*\.go
      linters:
        - gocritic
        - gomnd

  # Show only new issues created after git revision `REV`
  # new-from-rev: HEAD

  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 3

severity:
  # Default severity of issues
  default-severity: error

  # Severity mapping
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - goconst
        - misspell
        - lll
      severity: warning